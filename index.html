<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rakuunamäki - Virtuaalinen Äänikävely</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; background: #111; color: #fff; overflow-x: hidden; }
    
    #map { height: 70vh; width: 100%; }
    
    #controls { padding: 6px; text-align: center; background: #222; }
    button { padding: 8px 16px; font-size: 14px; font-weight: bold; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 2px; }
    button:hover { background: #0056b3; }
    
    #info-box { padding: 8px 12px; background: #333; margin: 5px 8px; border-radius: 8px; display: flex; gap: 12px; align-items: center; min-height: 60px; }
    .text-container { flex-grow: 1; }

    .runner-avatar {
      width: 65px;
      height: 65px;
      object-fit: contain;
      filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.8));
    }

    #media-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      position: relative;
      width: 90%;
      max-width: 700px;
      height: 75vh;
      background-size: cover;
      background-position: center;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      box-sizing: border-box;
      border: 2px solid #444;
    }

    #modal-video {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #007bff;
      box-shadow: 0 6px 20px rgba(0,0,0,0.8);
      align-self: flex-start;
      display: none;
      background: #000;
    }

    .close-btn {
      position: absolute;
      top: 12px; right: 12px;
      background: #ff4444; color: white;
      border: none; width: 36px; height: 36px;
      font-size: 18px; font-weight: bold;
      border-radius: 50%; cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      z-index: 10000;
    }
    .close-btn:hover { background: #cc0000; }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="controls">
    <button onclick="aloitaAutomaatti()">▶ Katso Virtuaaliesittely</button>
    <button onclick="pysaytaKaikki()">⏹ Pysäytä</button>
  </div>

  <div id="info-box">
    <div class="text-container">
      <h3 id="target-title" style="margin:0 0 4px 0;">Tervetuloa Rakuunamäelle</h3>
      <p id="target-desc" style="margin:0; font-size: 14px;">Paina esittelynappia tai klikkaa kohteita kartalta tutustuaksesi tarinoihin.</p>
    </div>
  </div>

  <div id="media-modal">
    <div class="modal-content" id="modal-box">
      <button class="close-btn" onclick="suljeModal()">✕</button>
      
      <video id="modal-video" autoplay controls playsinline></video>
      
      <div style="background: rgba(0, 0, 0, 0.8); padding: 12px 16px; border-radius: 8px; backdrop-filter: blur(4px);">
        <h2 id="modal-title" style="margin:0 0 4px 0; color: #fff;"></h2>
        <p id="modal-desc" style="margin:0; font-size: 14px; color: #ddd;"></p>
      </div>
    </div>
  </div>

  <audio id="audio-player" preload="auto"></audio>

  <script>
    const map = L.map('map').setView([61.0594, 28.1775], 17);
    
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri'
    }).addTo(map);

    const kohteet = [
      {
        nimi: "Suomen ratsuväen muistomerkki",
        lat: 61.059663,
        lng: 28.180214,
        audio: "",
        kuvaus: "Kuuno Sevónin 1963 pystyttämä muistomerkki ja Nikolain vallit.",
        kuva: "patsas.jpg",
        video: "patsas.mp4" /* TARKISTA ETTÄ TIEDOSTON NIMI ON GITHUBISSA TÄMÄ */
      },
      {
        nimi: "Rakuunamäen pääportti",
        lat: 61.0597830,
        lng: 28.1789770,
        audio: "",
        kuvaus: "Historiallinen pääportti, joka erotti siviilielämän ja sotilaallisen kurin.",
        kuva: "paaportti.jpg",
        video: "paaportti.mov"
      },
      {
        nimi: "päävartio rakennus",
        lat: 61.0591569,
        lng: 28.1784266,
        audio: "putka.mp3",
        kuvaus: "Päävartiorakennus ja putka.",
        kuva: ""
      },
      {
        nimi: "pohjustus ennen rakuunahotellia",
        lat: 61.0593719,
        lng: 28.1774570,
        audio: "pohjustus.mp3",
        kuvaus: "Pohjustus ennen hotellia.",
        kuva: "" 
      },
      {
        nimi: "rakuunahotelli",
        lat: 61.0592660,
        lng: 28.17633415,
        audio: "rakuunahotelli.mp3",
        kuvaus: "Rakuunahotelli.",
        kuva: ""
      },
      {
        nimi: "sotilaskoti",
        lat: 61.059182,
        lng: 28.175187,
        audio: "sotku.mp3",
        kuvaus: "Sotilaskoti eli Sotku.",
        kuva: ""
      },
      {    
        nimi: "ruokala",
        lat: 61.0591133,
        lng: 28.1737116,
        audio: "ruokala.mp3",
        kuvaus: "Kasarmin ruokala.",
        kuva: ""
      },
      { 
        nimi: "chymos portti",
        lat: 61.058047,
        lng: 28.173163,
        audio: "chymoksenportti.mp3",
        kuvaus: "Chymoksen tehtaan portti.",
        kuva: ""
      },
      { 
        nimi: "chymos",
        lat: 61.0580152,
        lng: 28.1722136,
        audio: "chymos.mp3",
        kuvaus: "Chymoksen makeistehdasalue.",
        kuva: ""     
      },
      {
        nimi: "Upseerikerho",
        lat: 61.0591837,
        lng: 28.1705692,
        audio: "Upseerikerho.mp3",
        kuvaus: "Historiallinen Rakuunamäen Upseerikerho.",
        kuva: "upseerikerho.jpg"
      },
      {
       nimi: "Tuju Taproom",
        lat: 61.0594142,
        lng: 28.1737352,
        audio: "Tuju.mp3",
        kuvaus: "TapRoom.",
        kuva: ""
      },
      {
        nimi: "Adolf Ehrnroothin aukio",
        lat: 61.060096,
        lng: 28.174944,
        audio: "Adolf Ehrnroothin aukio.mp3",
        kuvaus: "Rakuunamäen keskusaukio ja päätepiste.",
        kuva: "aukio.jpg"
      }
    ];

    let nykyinenIndex = 0;
    let isAutoplay = false;
    let animationFrame = null;
    let meidanTimeout = null;
    const player = document.getElementById('audio-player');
    const videoPlayer = document.getElementById('modal-video');
    const modal = document.getElementById('media-modal');
    const modalBox = document.getElementById('modal-box');

    const hahmoIcon = L.divIcon({
      className: 'custom-runner-icon',
      html: '<img src="hahmo.png" class="runner-avatar">',
      iconSize: [65, 65],
      iconAnchor: [32, 32]
    });

    const hahmoMarker = L.marker([kohteet[0].lat, kohteet[0].lng], { icon: hahmoIcon }).addTo(map);

    kohteet.forEach((kohde, index) => {
      const marker = L.marker([kohde.lat, kohde.lng]).addTo(map);
      marker.bindPopup(`<b>${kohde.nimi}</b>`);
      
      marker.on('click', () => {
        isAutoplay = false;
        siirryKohteeseen(index, true);
      });
    });

    function aloitaAutomaatti() {
      isAutoplay = true;
      siirryKohteeseen(0, true);
    }

    function siirryKohteeseen(index, suoraan) {
      pysaytaMedia();
      if (meidanTimeout) clearTimeout(meidanTimeout);
      nykyinenIndex = index;
      const kohde = kohteet[index];
      const lahto = hahmoMarker.getLatLng();
      const maali = L.latLng(kohde.lat, kohde.lng);

      if (suoraan) {
        hahmoMarker.setLatLng(maali);
        map.flyTo(maali, 18, { duration: 1.2 });
        aktivoiMedia(kohde);
      } else {
        let startTime = null;
        const kesto = 3500;

        function animate(currentTime) {
          if (!startTime) startTime = currentTime;
          const progress = Math.min((currentTime - startTime) / kesto, 1);
          
          const curLat = lahto.lat + (maali.lat - lahto.lat) * progress;
          const curLng = lahto.lng + (maali.lng - lahto.lng) * progress;
          
          const uusiSijainti = L.latLng(curLat, curLng);
          hahmoMarker.setLatLng(uusiSijainti);
          map.panTo(uusiSijainti);

          if (progress < 1) {
            animationFrame = requestAnimationFrame(animate);
          } else {
            map.flyTo(maali, 18, { duration: 1.0 });
            aktivoiMedia(kohde);
          }
        }
        animationFrame = requestAnimationFrame(animate);
      }
    }

    function aktivoiMedia(kohde) {
      document.getElementById('target-title').innerText = kohde.nimi;
      document.getElementById('target-desc').innerText = kohde.kuvaus;
      document.getElementById('modal-title').innerText = kohde.nimi;
      document.getElementById('modal-desc').innerText = kohde.kuvaus;

      if (kohde.kuva && kohde.kuva.trim() !== "") {
        modalBox.style.backgroundImage = `url('${kohde.kuva}')`;
      } else {
        modalBox.style.backgroundImage = "none";
        modalBox.style.backgroundColor = "#222";
      }

      modal.style.display = "flex";

      if (kohde.video && kohde.video.trim() !== "") {
        videoPlayer.style.display = "block";
        videoPlayer.src = kohde.video;
        
        videoPlayer.play().catch(e => console.log("Videotoiston virhe:", e));

        videoPlayer.onended = function() {
          suljeModal();
          seuraavaKohdeAutomaatissa();
        };

        videoPlayer.onerror = function() {
          console.log("Videota ei voitu toistaa:", kohde.video);
          suljeModal();
          seuraavaKohdeAutomaatissa();
        };

      } else {
        videoPlayer.style.display = "none";

        if (kohde.audio && kohde.audio.trim() !== "") {
          player.src = kohde.audio;
          player.play().catch(e => {
            console.log("Toistovirhe:", kohde.audio);
            suljeModal();
            seuraavaKohdeAutomaatissa();
          });

          player.onended = function() {
            suljeModal();
            seuraavaKohdeAutomaatissa();
          };

          player.onerror = function() {
            console.log("Äänitiedostoa ei löydy:", kohde.audio);
            suljeModal();
            seuraavaKohdeAutomaatissa();
          };
        } else {
          meidanTimeout = setTimeout(() => {
            suljeModal();
            seuraavaKohdeAutomaatissa();
          }, 3000);
        }
      }
    }

    function suljeModal() {
      modal.style.display = "none";
      pysaytaMedia();
    }

    function seuraavaKohdeAutomaatissa() {
      if (isAutoplay && nykyinenIndex + 1 < kohteet.length) {
        meidanTimeout = setTimeout(() => {
          siirryKohteeseen(nykyinenIndex + 1, false);
        }, 1500);
      }
    }

    function pysaytaMedia() {
      player.pause();
      player.removeAttribute('src');
      videoPlayer.pause();
      videoPlayer.removeAttribute('src');
    }

    function pysaytaKaikki() {
      isAutoplay = false;
      if (animationFrame) cancelAnimationFrame(animationFrame);
      if (meidanTimeout) clearTimeout(meidanTimeout);
      suljeModal();
      document.getElementById('target-title').innerText = "Esittely pysäytetty";
      document.getElementById('target-desc').innerText = "Voit valita kohteen kartalta tai aloittaa uudelleen.";
    }
  </script>

</body>
</html>
